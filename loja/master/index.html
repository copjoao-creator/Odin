<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Plataforma · Odin Focus</title>
  <meta name="theme-color" content="#172C46">
  <!-- Fonte do Tênis de Mesa para Todos: Source Sans 3 (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3&display=swap" rel="stylesheet">
  <link rel="icon" href="/img/odin-focus-financeiro.png" type="image/png">
  <link rel="stylesheet" href="../css/loja.css">
  <link rel="stylesheet" href="../admin/admin.css">
</head>
<body class="painel">
  <!-- Painel do administrador master: cadastro e acompanhamento de todas as lojas.
       Layout do Painel do Administrador Master do Tênis de Mesa para Todos: barra fina no topo, quadro com borda e abas. -->
  <div class="app" id="app" hidden>
    <header class="barra-painel">
      <div class="barra-painel-in">
        <a class="logo master-logo" href="#lojas"><img src="/img/odin-focus-financeiro.png" alt="" width="40" height="40"><span class="logo-texto"><strong>Odin <span class="ouro-odin">Focus</span></strong><small>Plataforma</small></span></a>
        <div class="barra-painel-acoes">
          <span class="fraco" id="nomeAdmin"></span>
          <a class="link" href="/loja/">Ver a loja</a>
          <button type="button" class="btn btn-pequeno btn-sair" id="btnSair">Sair</button>
        </div>
      </div>
    </header>

    <main class="principal">
      <section class="quadro-painel">
        <div class="quadro-cab">
          <h1 class="titulo-tela"><span data-icone="escudo"></span><span id="tituloTela">Lojas</span></h1>
          <div class="topo-painel-acoes" id="acoesTela"></div>
        </div>
        <nav class="abas" id="nav" aria-label="Seções da plataforma">
          <a href="#lojas" data-tela="lojas">Lojas</a>
          <a href="#conta" data-tela="conta">Minha conta</a>
        </nav>
        <div class="conteudo" id="conteudo"></div>
      </section>
      <div class="rodape-painel" data-selo-clubes="linha"></div>
    </main>
  </div>

  <dialog class="dlg dlg-painel" id="dlg"></dialog>

  <script src="../js/comum.js" data-api="../api/"></script>
  <script src="master.js"></script>
</body>
</html>
